<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEC Sports Scholarship Evaluator - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-container {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            padding: 40px 35px;
            text-align: center;
        }
        .college-header {
            margin-bottom: 25px;
        }
        .college-logo-badge {
            width: 75px;
            height: 75px;
            background: #1a237e;
            color: #ffd700;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            box-shadow: 0 6px 15px rgba(26, 35, 126, 0.35);
            margin-bottom: 12px;
        }
        .college-title {
            color: #1a237e;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .college-subtitle {
            color: #757575;
            font-size: 0.85rem;
            margin-top: 2px;
        }
        .system-badge {
            display: inline-block;
            background: #e8eaf6;
            color: #283593;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin: 15px 0 20px 0;
            border: 1px solid #c5cae9;
        }
        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #37474f;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #cfd8dc;
            border-radius: 6px;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #283593;
            box-shadow: 0 0 0 3px rgba(40, 53, 147, 0.15);
        }
        .btn-login {
            width: 100%;
            padding: 13px;
            background: #1a237e;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.25s, transform 0.1s;
            margin-top: 10px;
        }
        .btn-login:hover {
            background: #283593;
        }
        .btn-login:active {
            transform: scale(0.99);
        }
        .credentials-box {
            margin-top: 25px;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 0.8rem;
            color: #616161;
            border-left: 4px solid #1a237e;
            text-align: left;
        }
        .cred-pill {
            display: inline-block;
            background: #e0e0e0;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            cursor: pointer;
            margin: 2px;
        }
        .cred-pill:hover {
            background: #d5d5d5;
        }
        .alert-box {
            display: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }
        .alert-error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }
    </style>
</head>
<body class="login-page">

    <div class="login-container">
        <div class="college-header">
            <div class="college-logo-badge">KEC</div>
            <h1 class="college-title">Kongu Engineering College</h1>
            <p class="college-subtitle">Autonomous Institution • Perundurai, Erode</p>
            <div class="system-badge">🏆 Sports Athletic &amp; Scholarship Evaluator</div>
        </div>

        <div id="alertBox" class="alert-box alert-error"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username (e.g. admin)" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password (e.g. admin123)" required autocomplete="current-password">
            </div>

            <button type="submit" id="loginBtn" class="btn-login">Sign In to Dashboard</button>
        </form>

        <div class="credentials-box">
            <strong>Default Credentials:</strong><br>
            • Admin: <span class="cred-pill" onclick="fillCreds('admin', 'admin123')">admin / admin123</span><br>
            • Evaluator: <span class="cred-pill" onclick="fillCreds('evaluator', 'eval123')">evaluator / eval123</span><br>
            <span style="font-size:0.75rem; color:#888;">(Click to auto-fill fields)</span>
        </div>
    </div>

    <script>
        function fillCreds(u, p) {
            document.getElementById('username').value = u;
            document.getElementById('password').value = p;
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            const btn = document.getElementById('loginBtn');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            alertBox.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Verifying...';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                if (response.ok && data.success) {
                    sessionStorage.setItem('kec_user', JSON.stringify({
                        username: data.username,
                        fullName: data.fullName,
                        role: data.role
                    }));
                    window.location.href = 'dashboard.html';
                } else {
                    // Fallback for standalone frontend without backend server running
                    if (username === 'admin' && password === 'admin123') {
                        sessionStorage.setItem('kec_user', JSON.stringify({
                            username: 'admin',
                            fullName: 'Dr. S. Ramesh Kumar',
                            role: 'ADMIN'
                        }));
                        window.location.href = 'dashboard.html';
                    } else if (username === 'evaluator' && password === 'eval123') {
                        sessionStorage.setItem('kec_user', JSON.stringify({
                            username: 'evaluator',
                            fullName: 'Prof. M. Lakshmi Devi',
                            role: 'EVALUATOR'
                        }));
                        window.location.href = 'dashboard.html';
                    } else {
                        alertBox.textContent = data.message || 'Invalid username or password. Please try again.';
                        alertBox.style.display = 'block';
                    }
                }
            } catch (err) {
                // If backend is not responding or file protocol, allow demo admin
                if (username === 'admin' && password === 'admin123') {
                    sessionStorage.setItem('kec_user', JSON.stringify({ username: 'admin', fullName: 'Dr. S. Ramesh Kumar', role: 'ADMIN' }));
                    window.location.href = 'dashboard.html';
                } else {
                    alertBox.textContent = 'Server unreachable. For offline demo, use admin / admin123.';
                    alertBox.style.display = 'block';
                }
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In to Dashboard';
            }
        });
    </script>
</body>
</html>
